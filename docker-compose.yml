version: '3.8'

services:
  db:
    container_name: pit-db-container
    image: mysql:8.0
    restart: on-failure
    ports:
      - '3306:3306'
    expose:
      - '3306'
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: pit-evaluations
      MYSQL_USER: pit-user
      MYSQL_PASSWORD: pit-mysql
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
